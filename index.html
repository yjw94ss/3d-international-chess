            // Merge group meshes into single smooth geometry mesh for performance
            buildPieceMesh(type, color) {
                const group = this.createPieceGeometry(type);
                const mat = color === 'w' ? this.materials.whitePiece : this.materials.blackPiece;

                // Traverse group & apply shadows/materials
                group.traverse(child => {
                    if (child.isMesh) {
                        child.material = mat;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // Orient Black pieces facing White and vice-versa
                if (color === 'b') {
                    group.rotation.y = Math.PI;
                }

                return group;
            }

            // Synchronize 3D Board Meshes with Pure JS Engine State
            syncBoardWithEngine(engine) {
                // Clear existing piece meshes.
                // Must iterate the authoritative Set, NOT pieceMeshes: on a capture the
                // destination key is overwritten, leaving the captured mesh unreachable
                // via the Map but still parented to the scene.
                this.allPieceMeshes.forEach(mesh => {
                    this.scene.remove(mesh);
                    mesh.traverse(child => {
                        if (child.isMesh && child.geometry) child.geometry.dispose();
                    });
                });
                this.allPieceMeshes.clear();
                this.pieceMeshes.clear();

                for (let i = 0; i < 64; i++) {
                    const piece = engine.board[i];
                    if (piece) {
                        const x = i % 8;
                        const y = Math.floor(i / 8);
                        const pieceMesh = this.buildPieceMesh(piece.type, piece.color);
                        
                        const worldX = x - 3.5;
                        const worldZ = 3.5 - y;
                        pieceMesh.position.set(worldX, 0, worldZ);
                        pieceMesh.userData = { squareIdx: i, type: piece.type, color: piece.color };

                        this.scene.add(pieceMesh);
                        this.pieceMeshes.set(i, pieceMesh);
                        this.allPieceMeshes.add(pieceMesh);
                    }
                }
            }

            // Detach a single piece mesh from the scene and from BOTH registries.
            // Removal is immediate on purpose: syncBoardWithEngine() rebuilds the whole
            // board right after the move, so any lingering fade-out would briefly overlap
            // the newly created piece on the same square.
            removePieceMesh(mesh) {
                if (!mesh) return;

                // Drop any square->mesh mapping that still points at this mesh
                const staleKeys = [];
                this.pieceMeshes.forEach((m, idx) => {
                    if (m === mesh) staleKeys.push(idx);
                });
                staleKeys.forEach(idx => this.pieceMeshes.delete(idx));

                this.allPieceMeshes.delete(mesh);
                this.scene.remove(mesh);
                mesh.traverse(child => {
                    if (child.isMesh && child.geometry) child.geometry.dispose();
                });
            }

            // Animated Smooth Piece Movement along Quadratic Arc
            animateMove(fromIdx, toIdx, onComplete) {
                const pieceMesh = this.pieceMeshes.get(fromIdx);
                if (!pieceMesh) {
                    if (onComplete) onComplete();
                    return;
                }

                // Capture case: the destination square is occupied. Keep a handle on the
                // victim so it can be properly unregistered on landing, instead of being
                // silently dropped from the Map and left floating in the scene.
                const capturedMesh = (toIdx !== fromIdx) ? this.pieceMeshes.get(toIdx) : null;

                const toX = (toIdx % 8) - 3.5;
                const toZ = 3.5 - Math.floor(toIdx / 8);
                const startPos = pieceMesh.position.clone();
                const targetPos = new THREE.Vector3(toX, 0, toZ);

                const duration = 320; // ms
                const startTime = performance.now();

                const animateStep = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1.0);
                    // Ease in-out quadratic
                    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                    pieceMesh.position.lerpVectors(startPos, targetPos, ease);
                    // Parabolic arc lift
                    pieceMesh.position.y = Math.sin(progress * Math.PI) * 0.8;

                    if (progress < 1.0) {
                        requestAnimationFrame(animateStep);
                    } else {
                        pieceMesh.position.y = 0;
                        this.pieceMeshes.delete(fromIdx);
                        if (capturedMesh && capturedMesh !== pieceMesh) this.removePieceMesh(capturedMesh);
                        this.pieceMeshes.set(toIdx, pieceMesh);
                        this.allPieceMeshes.add(pieceMesh);
                        if (onComplete) onComplete();
                    }
                };

                requestAnimationFrame(animateStep);
            }

            // Display Highlights: Selected piece, legal move dots, capture rings
            showHighlights(selectedIdx, legalMoves = []) {
                this.clearHighlights();

                // 1. Selection Ring
                if (selectedIdx !== null) {
                    const sx = (selectedIdx % 8) - 3.5;
                    const sy = 3.5 - Math.floor(selectedIdx / 8);
                    const ringGeom = new THREE.RingGeometry(0.35, 0.46, 32);
                    ringGeom.rotateX(-Math.PI / 2);
                    const ring = new THREE.Mesh(ringGeom, this.materials.selectRing);
                    ring.position.set(sx, 0.02, sy);
                    this.scene.add(ring);
                    this.highlightMeshes.push(ring);
                }

                // 2. Target Indicators (Green dots for empty moves, Red rings for captures)
                legalMoves.forEach(m => {
                    const tx = m.to.x - 3.5;
                    const ty = 3.5 - m.to.y;

                    if (m.captured) {
                        const capGeom = new THREE.RingGeometry(0.32, 0.45, 32);
                        capGeom.rotateX(-Math.PI / 2);
                        const capRing = new THREE.Mesh(capGeom, this.materials.captureRing);
                        capRing.position.set(tx, 0.02, ty);
                        this.scene.add(capRing);
                        this.highlightMeshes.push(capRing);
                    } else {
                        const dotGeom = new THREE.CircleGeometry(0.14, 24);
                        dotGeom.rotateX(-Math.PI / 2);
                        const dot = new THREE.Mesh(dotGeom, this.materials.legalMoveDot);
                        dot.position.set(tx, 0.02, ty);
                        this.scene.add(dot);
                        this.highlightMeshes.push(dot);
                    }
                });
            }

            setLastMoveHighlight(fromIdx, toIdx) {
                this.lastMoveHighlights.forEach(m => this.scene.remove(m));
                this.lastMoveHighlights = [];

                [fromIdx, toIdx].forEach(idx => {
                    if (idx !== null && idx !== undefined) {
                        const x = (idx % 8) - 3.5;
                        const z = 3.5 - Math.floor(idx / 8);
                        const tileGeom = new THREE.PlaneGeometry(0.96, 0.96);
                        tileGeom.rotateX(-Math.PI / 2);
                        const tile = new THREE.Mesh(tileGeom, this.materials.lastMoveTile);
                        tile.position.set(x, 0.01, z);
                        this.scene.add(tile);
                        this.lastMoveHighlights.push(tile);
                    }
                });
            }

            setCheckHighlight(kingIdx) {
                if (this.checkHighlightMesh) {
                    this.scene.remove(this.checkHighlightMesh);
                    this.checkHighlightMesh = null;
                }
                if (kingIdx !== null) {
                    const x = (kingIdx % 8) - 3.5;
                    const z = 3.5 - Math.floor(kingIdx / 8);
                    const tileGeom = new THREE.PlaneGeometry(0.98, 0.98);
                    tileGeom.rotateX(-Math.PI / 2);
                    this.checkHighlightMesh = new THREE.Mesh(tileGeom, this.materials.checkTile);
                    this.checkHighlightMesh.position.set(x, 0.015, z);
                    this.scene.add(this.checkHighlightMesh);
                }
            }

            clearHighlights() {
                this.highlightMeshes.forEach(m => this.scene.remove(m));
                this.highlightMeshes = [];
            }

            // Raycasting Setup for Mouse Hover & Click Detection
            setupRaycaster() {
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
            }

            getSquareFromMouse(event) {
                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.squareMeshes);

                if (intersects.length > 0) {
                    return intersects[0].object.userData.squareIdx;
                }
                return null;
            }

            // Smooth Camera Preset Transitions
            setCameraPreset(preset) {
                let targetPos = new THREE.Vector3();
                if (preset === 'white') targetPos.set(0, 8.5, 8.5);
                else if (preset === 'black') targetPos.set(0, 8.5, -8.5);
                else if (preset === 'top') targetPos.set(0, 11, 0.01);

                const startPos = this.camera.position.clone();
                const duration = 600;
                const startTime = performance.now();

                const anim = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                    this.camera.position.lerpVectors(startPos, targetPos, ease);
                    this.controls.update();

                    if (progress < 1) requestAnimationFrame(anim);
                };
                requestAnimationFrame(anim);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        /**
         * ====================================================================
         * 3. WEB AUDIO PROCEDURAL SOUND SYNTHESIZER
         * ====================================================================
         */
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playMove() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCapture() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playCheck() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1); // A5

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playWin() {
                if (!this.enabled) return;
                this.init();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
                });
            }
        }

        /**
         * ====================================================================
         * 4. MAIN APP CONTROLLER & UI BINDINGS
         * ====================================================================
         */
        class AppController {
            constructor() {
                this.engine = new ChessEngine();
                this.chess3D = new Chess3D(document.getElementById('canvas-container'));
                this.sound = new SoundFX();

                // Game Configurations
                this.mode = 'pve';          // 'pve' or 'pvp'
                this.playerSide = 'w';       // 'w' or 'b'
                this.aiDifficulty = 1;       // 1: Casual, 2: Intermediate, 3: Master
                this.selectedSquare = null;
                this.activeLegalMoves = [];
                this.pendingPromotionMove = null;
                this.isAIThinking = false;

                this.initUI();
                this.newGame();
            }

            initUI() {
                // Mode Toggle
                document.getElementById('mode-pve').addEventListener('click', () => this.setMode('pve'));
                document.getElementById('mode-pvp').addEventListener('click', () => this.setMode('pvp'));

                // Player Side Toggle
                document.getElementById('btn-side-white').addEventListener('click', () => this.setPlayerSide('w'));
                document.getElementById('btn-side-black').addEventListener('click', () => this.setPlayerSide('b'));

                // AI Difficulty Level
                document.querySelectorAll('#ai-difficulty-group button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.aiDifficulty = parseInt(e.target.dataset.level);
                        document.querySelectorAll('#ai-difficulty-group button').forEach(b => {
                            b.className = 'px-2 py-1 rounded text-[11px] font-medium glass-button text-slate-300';
                        });
                        e.target.className = 'px-2 py-1 rounded text-[11px] font-medium glass-button bg-amber-500/20 text-amber-300 border-amber-500/40';
                    });
                });

                // Themes
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        const themeKey = target.dataset.theme;
                        this.chess3D.setTheme(themeKey);
                        document.querySelectorAll('.theme-btn').forEach(b => b.className = 'theme-btn glass-button p-2 rounded-lg flex flex-col items-center gap-1 text-slate-400');
                        target.className = 'theme-btn glass-button p-2 rounded-lg flex flex-col items-center gap-1 border-amber-500/50 bg-amber-500/10';
                    });
                });

                // Camera Presets
                document.getElementById('cam-white').addEventListener('click', () => this.chess3D.setCameraPreset('white'));
                document.getElementById('cam-black').addEventListener('click', () => this.chess3D.setCameraPreset('black'));
                document.getElementById('cam-top').addEventListener('click', () => this.chess3D.setCameraPreset('top'));

                // Actions
                document.getElementById('btn-new-game').addEventListener('click', () => this.newGame());
                document.getElementById('btn-undo').addEventListener('click', () => this.undo());
                document.getElementById('btn-hint').addEventListener('click', () => this.showHint());
                document.getElementById('btn-restart-gameover').addEventListener('click', () => {
                    document.getElementById('modal-gameover').classList.add('hidden');
                    this.newGame();
                });

                // Sound Toggle
                document.getElementById('btn-sound').addEventListener('click', (e) => {
                    this.sound.enabled = !this.sound.enabled;
                    const icon = e.currentTarget.querySelector('i');
                    icon.className = this.sound.enabled ? 'fa-solid fa-volume-high text-base' : 'fa-solid fa-volume-xmark text-base text-rose-400';
                });

                // Mobile Panel Toggle
                document.getElementById('btn-toggle-panel').addEventListener('click', () => {
                    document.getElementById('side-panel').classList.toggle('hidden');
                });

                // Pawn Promotion Modal Selection
                document.querySelectorAll('#promotion-options button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const promoType = e.currentTarget.dataset.piece;
                        document.getElementById('modal-promotion').classList.add('hidden');
                        if (this.pendingPromotionMove) {
                            this.pendingPromotionMove.promotion = promoType;
                            this.executePlayerMove(this.pendingPromotionMove);
                            this.pendingPromotionMove = null;
                        }
                    });
                });

                // 3D Canvas Click Event
                window.addEventListener('pointerdown', (e) => {
                    // Ignore clicks on UI elements
                    if (e.target.closest('#side-panel') || e.target.closest('header') || e.target.closest('.fixed')) return;
                    this.onBoardClick(e);
                });
            }

            setMode(mode) {
                this.mode = mode;
                document.getElementById('mode-pve').className = mode === 'pve' ?
                    'glass-button py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 border-amber-500/50 bg-amber-500/20 text-amber-200' :
                    'glass-button py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 text-slate-300';
                document.getElementById('mode-pvp').className = mode === 'pvp' ?
                    'glass-button py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 border-amber-500/50 bg-amber-500/20 text-amber-200' :
                    'glass-button py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 text-slate-300';

                document.getElementById('ai-settings').style.display = mode === 'pve' ? 'block' : 'none';
                document.getElementById('mode-desc').innerText = mode === 'pve' ? `人机对战 (${this.playerSide === 'w' ? '白棋' : '黑棋'})` : '双人同屏';
                this.newGame();
            }

            setPlayerSide(side) {
                this.playerSide = side;
                document.getElementById('btn-side-white').className = side === 'w' ? 'px-2.5 py-1 rounded text-[11px] font-medium glass-button bg-amber-500/20 text-amber-300 border-amber-500/40' : 'px-2.5 py-1 rounded text-[11px] font-medium glass-button text-slate-300';
                document.getElementById('btn-side-black').className = side === 'b' ? 'px-2.5 py-1 rounded text-[11px] font-medium glass-button bg-amber-500/20 text-amber-300 border-amber-500/40' : 'px-2.5 py-1 rounded text-[11px] font-medium glass-button text-slate-300';
                document.getElementById('mode-desc').innerText = `人机对战 (${side === 'w' ? '白棋' : '黑棋'})`;
                this.chess3D.setCameraPreset(side === 'w' ? 'white' : 'black');
                this.newGame();
            }

            newGame() {
                this.engine.reset();
                this.selectedSquare = null;
                this.activeLegalMoves = [];
                this.isAIThinking = false;
                this.chess3D.syncBoardWithEngine(this.engine);
                this.chess3D.clearHighlights();
                this.chess3D.setLastMoveHighlight(null, null);
                this.chess3D.setCheckHighlight(null);
                this.updateUI();

                // If playing as Black against AI, trigger initial AI move
                if (this.mode === 'pve' && this.playerSide === 'b') {
                    this.triggerAIMove();
                }
            }

            onBoardClick(event) {
                if (this.isAIThinking) return;
                // If in PvE and not player's turn, ignore
                if (this.mode === 'pve' && this.engine.turn !== this.playerSide) return;

                const clickedIdx = this.chess3D.getSquareFromMouse(event);
                if (clickedIdx === null) {
                    this.clearSelection();
                    return;
                }

                const clickedX = clickedIdx % 8;
                const clickedY = Math.floor(clickedIdx / 8);
                const clickedPiece = this.engine.getPiece(clickedX, clickedY);

                // If clicking one of the highlighted target moves
                const targetMove = this.activeLegalMoves.find(m => m.to.x === clickedX && m.to.y === clickedY);
                if (targetMove) {
                    // Check if Promotion is required
                    if (targetMove.piece.type === 'p' && (targetMove.to.y === 0 || targetMove.to.y === 7)) {
                        this.pendingPromotionMove = targetMove;
                        document.getElementById('modal-promotion').classList.remove('hidden');
                        return;
                    }
                    this.executePlayerMove(targetMove);
                    return;
                }

                // Selecting a piece of the current turn color
                if (clickedPiece && clickedPiece.color === this.engine.turn) {
                    this.selectedSquare = clickedIdx;
                    this.activeLegalMoves = this.engine.getLegalMoves(clickedX, clickedY);
                    this.chess3D.showHighlights(this.selectedSquare, this.activeLegalMoves);
                } else {
                    this.clearSelection();
                }
            }

            clearSelection() {
                this.selectedSquare = null;
                this.activeLegalMoves = [];
                this.chess3D.clearHighlights();
            }

            executePlayerMove(move) {
                const fromIdx = move.from.x + move.from.y * 8;
                const toIdx = move.to.x + move.to.y * 8;
                this.clearSelection();

                this.chess3D.animateMove(fromIdx, toIdx, () => {
                    const result = this.engine.makeMove(move);
                    this.chess3D.syncBoardWithEngine(this.engine);
                    this.chess3D.setLastMoveHighlight(fromIdx, toIdx);

                    if (move.captured) this.sound.playCapture();
                    else this.sound.playMove();

                    this.postMoveCheck(result);

                    // Trigger AI response if PvE
                    if (result.gameState === 'active' && this.mode === 'pve' && this.engine.turn !== this.playerSide) {
                        this.triggerAIMove();
                    }
                });
            }

            triggerAIMove() {
                this.isAIThinking = true;
                document.getElementById('ai-thinking').classList.remove('hidden');

                setTimeout(() => {
                    const bestMove = this.engine.getBestMoveAI(this.aiDifficulty);
                    document.getElementById('ai-thinking').classList.add('hidden');
                    this.isAIThinking = false;

                    if (bestMove) {
                        const fromIdx = bestMove.from.x + bestMove.from.y * 8;
                        const toIdx = bestMove.to.x + bestMove.to.y * 8;

                        // Auto-promote AI pawn to Queen
                        if (bestMove.piece.type === 'p' && (bestMove.to.y === 0 || bestMove.to.y === 7)) {
                            bestMove.promotion = 'q';
                        }

                        this.chess3D.animateMove(fromIdx, toIdx, () => {
                            const result = this.engine.makeMove(bestMove);
                            this.chess3D.syncBoardWithEngine(this.engine);
                            this.chess3D.setLastMoveHighlight(fromIdx, toIdx);

                            if (bestMove.captured) this.sound.playCapture();
                            else this.sound.playMove();

                            this.postMoveCheck(result);
                        });
                    }
                }, 300);
            }

            postMoveCheck(result) {
                const currentTurn = this.engine.turn;
                const inCheck = this.engine.isInCheck(currentTurn);

                if (inCheck) {
                    const kingPos = this.engine.findKing(currentTurn);
                    if (kingPos) this.chess3D.setCheckHighlight(kingPos.x + kingPos.y * 8);
                    this.sound.playCheck();
                } else {
                    this.chess3D.setCheckHighlight(null);
                }

                this.updateUI();

                if (result.gameState !== 'active') {
                    this.handleEndgame(result.gameState);
                }
            }

            handleEndgame(state) {
                const modal = document.getElementById('modal-gameover');
                const title = document.getElementById('gameover-title');
                const reason = document.getElementById('gameover-reason');
                const icon = document.getElementById('gameover-icon');

                modal.classList.remove('hidden');

                if (state === 'checkmate') {
                    const winner = this.engine.turn === 'w' ? '黑方' : '白方';
                    title.innerText = `${winner} 胜利！`;
                    reason.innerText = `将死！${this.engine.turn === 'w' ? '白方' : '黑方'}已无路可走。`;
                    icon.className = 'fa-solid fa-trophy';
                    this.sound.playWin();
                } else {
                    title.innerText = '和局 (Draw)';
                    icon.className = 'fa-solid fa-handshake';
                    if (state === 'stalemate') reason.innerText = '逼和！无合法走法且未处于被将军状态。';
                    else if (state === 'insufficient') reason.innerText = '子力不足，无法达成将死。';
                    else if (state === '50move') reason.innerText = '触发 50 回合未吃子/未动兵和棋规则。';
                    else if (state === 'threefold') reason.innerText = '触发三次重复局面和棋规则。';
                }
            }

            undo() {
                if (this.isAIThinking) return;
                // In PvE, undo 2 steps (player + AI)
                const undoSteps = (this.mode === 'pve' && this.engine.moveHistory.length >= 2) ? 2 : 1;
                for (let i = 0; i < undoSteps; i++) {
                    this.engine.undoMove();
                }
                this.chess3D.syncBoardWithEngine(this.engine);
                this.chess3D.clearHighlights();

                const lastMove = this.engine.moveHistory[this.engine.moveHistory.length - 1];
                if (lastMove) {
                    this.chess3D.setLastMoveHighlight(lastMove.from.x + lastMove.from.y * 8, lastMove.to.x + lastMove.to.y * 8);
                } else {
                    this.chess3D.setLastMoveHighlight(null, null);
                }

                this.chess3D.setCheckHighlight(null);
                this.updateUI();
            }

            showHint() {
                if (this.isAIThinking) return;
                const bestMove = this.engine.getBestMoveAI(2);
                if (bestMove) {
                    const fromIdx = bestMove.from.x + bestMove.from.y * 8;
                    this.selectedSquare = fromIdx;
                    this.activeLegalMoves = [bestMove];
                    this.chess3D.showHighlights(fromIdx, [bestMove]);
                }
            }

            updateUI() {
                // Status Badge Update
                const turnDot = document.getElementById('turn-dot');
                const statusText = document.getElementById('status-text');
                const turnStr = this.engine.turn === 'w' ? '白方' : '黑方';
                const inCheck = this.engine.isInCheck(this.engine.turn);

                turnDot.className = this.engine.turn === 'w' ?
                    'w-3.5 h-3.5 rounded-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.8)]' :
                    'w-3.5 h-3.5 rounded-full bg-slate-900 border border-slate-600 shadow-[0_0_10px_rgba(0,0,0,0.8)]';

                if (inCheck) {
                    statusText.innerText = `${turnStr}回合 (将军！)`;
                    statusText.className = 'text-sm font-bold tracking-wide text-amber-400 animate-pulse';
                } else {
                    statusText.innerText = `${turnStr}回合`;
                    statusText.className = 'text-sm font-semibold tracking-wide text-slate-200';
                }

                // Captured Pieces & Material Score Update
                const { capturedByWhite, capturedByBlack, scoreDiff } = this.engine.getCapturedPieces();
                const iconMap = { p: 'fa-chess-pawn', n: 'fa-chess-knight', b: 'fa-chess-bishop', r: 'fa-chess-rook', q: 'fa-chess-queen' };

                const whiteCapturedEl = document.getElementById('captured-white-pieces');
                const blackCapturedEl = document.getElementById('captured-black-pieces');

                whiteCapturedEl.innerHTML = capturedByBlack.map(p => `<i class="fa-solid ${iconMap[p]} text-white text-xs"></i>`).join('');
                blackCapturedEl.innerHTML = capturedByWhite.map(p => `<i class="fa-solid ${iconMap[p]} text-slate-900 text-xs"></i>`).join('');

                const advEl = document.getElementById('material-advantage');
                if (scoreDiff > 0) {
                    advEl.innerText = `白方 +${scoreDiff}`;
                    advEl.className = 'font-mono font-bold text-emerald-400';
                } else if (scoreDiff < 0) {
                    advEl.innerText = `黑方 +${Math.abs(scoreDiff)}`;
                    advEl.className = 'font-mono font-bold text-amber-400';
                } else {
                    advEl.innerText = '平手 (+0)';
                    advEl.className = 'font-mono font-bold text-slate-400';
                }

                // Move History SAN Table Update
                const historyList = document.getElementById('move-history-list');
                const history = this.engine.moveHistory;

                if (history.length === 0) {
                    historyList.innerHTML = '<div class="text-slate-500 text-center py-4">暂无走法记录</div>';
                    return;
                }

                let html = '';
                for (let i = 0; i < history.length; i += 2) {
                    const moveNum = Math.floor(i / 2) + 1;
                    const whiteMove = history[i] ? history[i].san : '';
                    const blackMove = history[i + 1] ? history[i + 1].san : '';

                    html += `
                        <div class="grid grid-cols-5 gap-1 py-1 px-2 rounded hover:bg-slate-800/50">
                            <span class="text-slate-500 col-span-1">${moveNum}.</span>
                            <span class="text-slate-200 font-semibold col-span-2">${whiteMove}</span>
                            <span class="text-slate-400 col-span-2">${blackMove}</span>
                        </div>
                    `;
                }
                historyList.innerHTML = html;
                historyList.scrollTop = historyList.scrollHeight;
            }
        }

        // Initialize App on Page Load
        window.onload = () => {
            window.app = new AppController();
        };
    </script>
</body>
</html>
